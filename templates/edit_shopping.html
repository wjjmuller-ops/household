{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Edit Shopping Item</h1>

<div class="card p-3">
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Item</label>
            <input name="item" class="form-control" value="{{ item.item }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantity / note</label>
            <input name="quantity" class="form-control" value="{{ item.quantity or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
                {% for cat in ["Groceries", "Pharmacy", "Hardware", "Animals", "TAKEALOT", "Wishlist", "Market", "Other"] %}
                    <option {% if (item.category or "Other") == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <button class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('shopping_page') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
