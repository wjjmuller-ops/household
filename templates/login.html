<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Household Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0906">

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="dog-theme login-dog-screen">
<div class="app-bg-overlay"></div>

<div class="login-page themed-login-page">
    <div class="container">
        <div class="row justify-content-center justify-content-lg-start">
            <div class="col-md-6 col-lg-4">
                <div class="login-theme-card">
                    <div class="text-center mb-4">
                        <div class="login-logo">🏠</div>
                        <h1 class="login-title">Household Hub</h1>
                        <p class="login-subtitle">Sign in to your household app</p>
                    </div>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="post">
                        <div class="mb-3">
                            <label class="form-label">User name</label>
                            <input name="name" class="form-control" required autofocus>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <input id="passwordInput" name="password" type="password" class="form-control" required>
                                <button id="togglePasswordBtn" class="btn btn-outline-warning" type="button">Show</button>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="stay_logged_in" id="stayLoggedIn">
                            <label class="form-check-label" for="stayLoggedIn">
                                Stay logged in
                            </label>
                        </div>

                        <button class="btn btn-warning w-100 fw-bold">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
