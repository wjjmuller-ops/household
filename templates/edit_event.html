{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Edit Event</h1>

<div class="card p-3">
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Event title</label>
            <input name="title" class="form-control" value="{{ event.title }}" required>
        </div>
        <div class="row">
            <div class="col-md-7 mb-3">
                <label class="form-label">Date</label>
                <input name="event_date" type="date" class="form-control" value="{{ event.event_date }}" required>
            </div>
            <div class="col-md-5 mb-3">
                <label class="form-label">Time</label>
                <input name="event_time" type="time" class="form-control" value="{{ event.event_time or '' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input name="location" class="form-control" value="{{ event.location or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Description / notes</label>
            <textarea name="description" class="form-control" rows="4">{{ event.description or '' }}</textarea>
        </div>
        <button class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('event_detail', event_id=event.id) }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
